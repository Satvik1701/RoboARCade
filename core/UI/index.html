            <circle cx="${x1}" cy="${y1}" r="10" fill="rgba(0,0,0,0.86)"/>
            <circle cx="${x1}" cy="${y1}" r="6" fill="#22c55e" stroke="white" stroke-width="2"/>
            <circle cx="${x}" cy="${y}" r="10" fill="rgba(0,0,0,0.86)"/>
            <circle cx="${x}" cy="${y}" r="6" fill="#38bdf8" stroke="white" stroke-width="2"/>
          </g>`;
        ov.innerHTML = `
          <svg width="100%" height="100%" aria-hidden="true">${drag}
            <g transform="translate(${x - 14} ${y - 14})" stroke-linecap="round"
               style="filter: drop-shadow(0 1px 2px rgba(0,0,0,0.85))">
              <path d="M14 3 V10 M14 18 V25 M3 14 H10 M18 14 H25"
                    stroke="black" stroke-width="4" fill="none"/>
              <path d="M14 3 V10 M14 18 V25 M3 14 H10 M18 14 H25"
                    stroke="white" stroke-width="2" fill="none"/>
              <circle cx="14" cy="14" r="1.6" fill="white" stroke="black" stroke-width="1"/>
            </g>
          </svg>`;
        const g = ov.querySelector('#mcp-drag');
        if (g) setTimeout(() => {
          g.style.opacity = '0';
          setTimeout(() => g.remove(), 900);
        }, 5000);
        return drawn();
      },

      translate(dx, dy, dz) {
        selectedObject.position.x += dx * 10;
        selectedObject.position.y += dz * 10;
        selectedObject.position.z += -dy * 10;
        return drawn();
      },

      rotate(axis, deg) {
        rotateSelectedObject(axis, deg * Math.PI / 180);
        return drawn();
      },

      advance(steps) {
        for (let i = 0; i < Math.abs(steps); i++) stepAlongApproach(steps > 0 ? 'f' : 'b');
        return drawn();
      },

      toggleGripper() {
        toggleTargetJaws();
        return drawn();
      },

      endEpisode(by) {
        endEpisode(by);
        return true;
      },

      reset() {
        return { ...snapGripperToArmPose(selectedArmIdx), ...drawn() };
      },

      teleport(x, y) {
        const el = document.elementFromPoint(x, y);
        const ev = { clientX: x, clientY: y };
        const wf = WRIST_FEEDS.find(f => el === document.getElementById(f.img));
        if (el === renderer.domElement) placeGripper(ev);
        else if (el === camAgentEl) handleCamImageClick(ev, el, tpCam);
        else if (wf) handleCamImageClick(ev, el, wf.label);
        const c = cubeMesh.position;
        return { ...drawn(),
                 click: cubeMesh.visible ? { x: c.x, y: c.y, z: c.z } : null };
      },

      guides(kind) {
        setGizmoHold(kind === 'gizmo');
        updateGuideCylinder(kind !== 'none');
        if (kind === 'none') arrowHelper.visible = false;
        return drawn();
      },

      cameraOrbit(dAz, dEl) {
        const cam = cameraState();
        const wanted = cam.elevation + dEl;
        const el = Math.min(Math.max(wanted, 0), TOP_ELEVATION_DEG);
        setCameraPose(((cam.azimuth + dAz) % 360 + 360) % 360, el, null, null);
        return { ...drawn(), elevation_wanted: wanted, elevation_set: el };
      },

      cameraSet(azDeg, elDeg, radius, target) {
        setCameraPose(azDeg, elDeg, radius, target);
        return drawn();
      },

      cameraPan(dRight, dUp) {
        camera.updateMatrixWorld();
        const e = camera.matrixWorld.elements;
        const right = new THREE.Vector3(e[0], e[1], e[2]);
        right.y = 0;
        if (right.lengthSq() < 1e-9) { right.set(1, 0, 0); }
        right.normalize();
        const delta = new THREE.Vector3().addScaledVector(right, dRight);
        delta.y += dUp;
        camera.position.add(delta);
        cameraTarget.add(delta);
        camera.lookAt(cameraTarget);
        return drawn();
      },

      cameraZoom(x, y, steps) {
        if (document.elementFromPoint(x, y) === renderer.domElement) {
          for (let i = 0; i < Math.abs(steps); i++) {
            zoomCameraAtPointer({ clientX: x, clientY: y, deltaY: steps > 0 ? -100 : 100 });
          }
        }
        return drawn();
      },

      cameraReset() {
        resetCameraView();
        return drawn();
      },

      selectFeed: (name) => window.__setTpCam(name),

      recordWaypoint() {
        const before = window.__waypointDoneCount || 0;
        executeWaypoint();
        return { ...drawn(), waypointDone: before };
      },

      home(arm) {
        return { ...homeArm(arm), ...drawn() };
      },
    };

    for (const [action, fn] of Object.entries(window.roboarcade)) {
      if (action === 'state') continue;
      window.roboarcade[action] = (...args) => {
        inputLog.push({ type: 'api', action, args, t: Date.now(),
                        frame: captureFrame(), cam0: camPose() });
        return fn(...args);
      };
    }

    let lastActivity = performance.now(), needsRender = true;
    const touch = () => { lastActivity = performance.now(); };
    for (const ev of ['pointerdown', 'pointermove', 'pointerup', 'wheel', 'keydown', 'keyup'])
      window.addEventListener(ev, touch, { capture: true, passive: true });
    (function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      if (now - lastActivity < 500 || needsRender) {
        renderFrame(); needsRender = false;
      }
    })();

  </script>

</body>
</html>
